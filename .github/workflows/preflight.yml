name: buildbot preflight
on: [push, workflow_dispatch]

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm -v "$PWD":/src -w /src ubuntu:focal sh -c '
            export DEBIAN_FRONTEND=noninteractive &&
            apt-get update -qy &&
            apt-get install -qy build-essential autoconf automake libtool pkg-config gettext libglib2.0-dev libopenal-dev libpng-dev zlib1g-dev libgl1-mesa-dev &&
            ./autogen.sh &&
            ./configure --enable-shared --disable-static --without-libmpeg2 &&
            make -f Makefile.libretro gen -j2 &&
            make -f Makefile.libretro -j2 &&
            ls -la fsuae_libretro.so &&
            nm -D --defined-only fsuae_libretro.so | grep " T retro_" | sort &&
            ldd fsuae_libretro.so'
